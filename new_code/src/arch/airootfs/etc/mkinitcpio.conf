# vim:set ft=sh

# MODULES
# Load necessary kernel modules before boot hooks.
MODULES=(vmd)

# BINARIES
# Include additional binaries in the initramfs (rarely needed).
BINARIES=()

# FILES
# Include additional files as-is (e.g., config files).
FILES=()

# HOOKS
# Most important setting: controls modules and scripts in initramfs.
# Order matters. This is a standard, working configuration.
HOOKS=(base udev autodetect modconf block keyboard keymap consolefont filesystems fsck)

# COMPRESSION
# Use gzip by default. Uncomment to use another compressor.
#COMPRESSION="gzip"
#COMPRESSION="zstd"
#COMPRESSION="xz"

# COMPRESSION_OPTIONS
# Additional options for the compressor (if needed).
#COMPRESSION_OPTIONS=()   