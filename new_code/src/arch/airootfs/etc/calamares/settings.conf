# Calamares Configuration
branding: default

# Installation prompts and behavior
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: true

# Module search paths
modules-search: [ local, /usr/share/calamares/modules ]

# NO instances section here!

# Installation sequence
sequence:
  # User interaction phase
  - show:
      - locale
      - keyboard
      - partition
      - users
      - summary
  
  # Execution phase (actual installation)
  - exec:
      - partition
      - mount
      - unpackfs
      - locale
      - keyboard
      - users
      - displaymanager
      - packages
      - bootloader
      - umount
  
  # Completion phase
  - show:
      - finished